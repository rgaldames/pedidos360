<div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
  <h1>Pedidos360</h1>
  
  <!-- Interfaz de Usuario No Autenticado -->
  <div *ngIf="!isLoggedIn">
    <p>Inicie sesión con su cuenta corporativa para continuar.</p>
    <button (click)="login()" style="padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #0078d4; color: white; border: none; border-radius: 4px;">
      Iniciar sesión
    </button>
  </div>

  <!-- Interfaz de Usuario Autenticado -->
  <div *ngIf="isLoggedIn">
    <h2>Bienvenido/a, {{ userName }}</h2>
    
    <div style="margin: 30px 0;">
      <button (click)="consultarHora()" style="padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 4px;">
        Consultar hora
      </button>
    </div>

    <!-- Resultados en pantalla -->
    <div *ngIf="apiResponse" style="margin: 20px auto; padding: 15px; border: 1px solid #28a745; background-color: #e8f5e9; max-width: 600px;">
      <strong>Respuesta del Backend (AWS EC2 vía API Gateway):</strong> <br/><br/>
      {{ apiResponse }}
    </div>

    <!-- Errores en pantalla -->
    <div *ngIf="apiError" style="margin: 20px auto; padding: 15px; border: 1px solid #dc3545; background-color: #ffebee; color: #dc3545; max-width: 600px;">
      {{ apiError }}
    </div>

    <hr style="margin-top: 40px; width: 50%;">
    <button (click)="logout()" style="padding: 8px 16px; cursor: pointer; background-color: transparent; border: 1px solid #6c757d; border-radius: 4px;">
      Cerrar sesión
    </button>
  </div>

</div>

<!-- Las rutas se cargarán aquí si son necesarias a futuro -->
<router-outlet></router-outlet>
